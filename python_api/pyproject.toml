[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "layout-studio"
version = "0.1.0"
description = "Curve-referenced layout modelling for interactive Python workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "typing-extensions>=4.6; python_version < '3.11'",
]

[project.optional-dependencies]
viewer = ["vtk>=9.4,<10"]
plot2d = ["matplotlib>=3.7"]
test = ["pytest>=8", "matplotlib>=3.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/layout_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
