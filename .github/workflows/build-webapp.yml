name: Check webapp

on:
  push:
    branches:
      - main
    paths:
      - "webapp/**"
      - ".github/workflows/build-webapp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-webapp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        working-directory: webapp
        run: npm ci

      - name: Lint
        working-directory: webapp
        run: npm run lint

      - name: Build hosted application
        working-directory: webapp
        run: npm run build

      - name: Run model and geometry tests
        working-directory: webapp
        run: node --test tests/layout-data.test.mjs

      - name: Run application interface tests
        working-directory: webapp
        run: node --test --test-name-pattern='viewer|named-frame|dependency hierarchy|collapsible controls|top-bar action' tests/ui-components.test.mjs

      - name: Rebuild standalone application
        working-directory: webapp
        run: npm run build:standalone

      - name: Verify checked-in standalone application
        run: |
          git diff --exit-code -- webapp/build/index.html
          if grep -Eiq '<script[^>]+src=|<link[^>]+rel="stylesheet"' webapp/build/index.html; then
            echo "webapp/build/index.html contains an external build asset reference"
            exit 1
          fi
