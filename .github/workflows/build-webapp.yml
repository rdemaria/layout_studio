name: Check webapp

on:
  push:
    branches:
      - main
    paths:
      - "webapp/**"
      - ".github/workflows/build-webapp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-webapp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Build and test
        run: make -C webapp check

      - name: Validate standalone application
        run: |
          test -s webapp/build/index.html
          if grep -Eiq '<script[^>]+src=|<link[^>]+rel="stylesheet"' webapp/build/index.html; then
            echo "webapp/build/index.html contains an external build asset reference"
            exit 1
          fi
          grep -Fq "Layout Studio" webapp/build/index.html
