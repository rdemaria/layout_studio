name: Build webapp

on:
  push:
    branches:
      - main
    paths:
      - ".gitignore"
      - "webapp/build.py"
      - "webapp/src/**"
      - "webapp/tests/**"
      - "webapp/package.json"
      - ".github/workflows/build-webapp.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-webapp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build modular and standalone pages
        run: python3 webapp/build.py

      - name: Run model regression tests
        run: npm --prefix webapp test

      - name: Verify generated pages
        run: |
          python3 webapp/build.py --check
          test ! -n "$(grep -E '<script[^>]+src=|<link[^>]+rel="stylesheet"' webapp/build/index.html || true)"

      - name: Commit generated pages
        shell: bash
        run: |
          if [ -z "$(git status --porcelain --untracked-files=all -- webapp/index.html webapp/build/index.html)" ]; then
            echo "Generated pages are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp/index.html
          git add -f webapp/build/index.html
          git commit -m "Build standalone webapp"
          git push
