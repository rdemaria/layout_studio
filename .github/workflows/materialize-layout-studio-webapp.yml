name: Materialize Layout Studio webapp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-layout-studio-webapp.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and extract webapp source bundle
        shell: bash
        run: |
          cat webapp/.bootstrap/part*.b64 | base64 --decode > /tmp/layout-studio-webapp.tgz
          printf '%s  %s\n' '055d84d5e8a82049159dbd95e547d30c1f690d795221cfdda420fd10d098f153' /tmp/layout-studio-webapp.tgz | sha256sum --check --strict
          tar -xzf /tmp/layout-studio-webapp.tgz

      - name: Commit source and remove staging files
        shell: bash
        run: |
          rm -rf webapp/.bootstrap
          rm -f .github/workflows/materialize-layout-studio-webapp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A webapp .github/workflows/materialize-layout-studio-webapp.yml
          git commit -m 'Add Layout Studio web viewer app'
          git push origin HEAD:main
